<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password &middot; BioPredict</title>
  <meta name="description" content="Set a new password for your BioPredict research account.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230f766e'/><circle cx='16' cy='16' r='6' fill='%235eead4'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/style.css">

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script>
    if (!window.lucide) {
      document.write('<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"><\/script>');
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">
  <div class="ambient" aria-hidden="true">
    <div class="grid-fade"></div>
  </div>

  <header class="navbar auth-nav" id="navbar">
    <div class="container nav-inner">
      <a href="/app/" class="brand" aria-label="BioPredict home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="22" height="22" fill="none">
            <line x1="16" y1="16" x2="7" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55"/>
            <line x1="16" y1="16" x2="25" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55"/>
            <line x1="16" y1="16" x2="16" y2="27" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55"/>
            <circle cx="16" cy="16" r="5" fill="currentColor"/>
            <circle cx="7" cy="8" r="3" fill="currentColor" opacity=".8"/>
            <circle cx="25" cy="8" r="3" fill="currentColor" opacity=".8"/>
            <circle cx="16" cy="27" r="3" fill="currentColor" opacity=".8"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-title">BioPredict</span>
          <span class="brand-tag">Virtual Screening</span>
        </span>
      </a>
    </div>
  </header>

  <main class="auth-main">
    <div class="container auth-container">
      <div class="card auth-card">
        <div class="auth-header">
          <div class="auth-icon-circle">
            <i data-lucide="key-round"></i>
          </div>
          <h1 class="auth-title">Set New Password</h1>
          <p class="auth-sub">Choose a strong password for your BioPredict research account.</p>
        </div>

        <div class="auth-alert" id="resetAlert" hidden role="alert"></div>

        <form id="formResetPw" class="auth-form" novalidate>
          <div class="form-group">
            <label for="newPassword">New Password (minimum 6 characters)</label>
            <div class="input-with-icon">
              <i data-lucide="key-round"></i>
              <input type="password" id="newPassword" placeholder="Enter new password" required minlength="6" autocomplete="new-password">
              <button type="button" class="btn-toggle-pw" id="btnToggleNewPw" aria-label="Toggle password visibility">
                <i data-lucide="eye" id="eyeIconNew"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <div class="input-with-icon">
              <i data-lucide="check-circle"></i>
              <input type="password" id="confirmPassword" placeholder="Re-enter new password" required minlength="6" autocomplete="new-password">
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-auth-submit" id="btnUpdatePw">
            <i data-lucide="save"></i>
            <span>Update Password</span>
          </button>

          <a href="/app/login?force=1" class="btn-back-signin" style="text-decoration:none;">
            <i data-lucide="arrow-left"></i>
            <span>Back to Sign In</span>
          </a>
        </form>
      </div>
    </div>
  </main>

  <script>
    (function() {
      if (window.lucide) lucide.createIcons();

      const resetAlert = document.getElementById("resetAlert");
      const formResetPw = document.getElementById("formResetPw");
      const btnToggle = document.getElementById("btnToggleNewPw");
      const newPwInput = document.getElementById("newPassword");
      const eyeIcon = document.getElementById("eyeIconNew");

      btnToggle?.addEventListener("click", () => {
        const isPw = newPwInput.type === "password";
        newPwInput.type = isPw ? "text" : "password";
        if (eyeIcon) eyeIcon.setAttribute("data-lucide", isPw ? "eye-off" : "eye");
        if (window.lucide) lucide.createIcons();
      });

      function showAlert(msg, isSuccess = false) {
        if (!resetAlert) return;
        resetAlert.hidden = false;
        resetAlert.className = `auth-alert ${isSuccess ? "auth-alert-success" : "auth-alert-error"}`;
        resetAlert.innerHTML = `<i data-lucide="${isSuccess ? 'check-circle-2' : 'alert-circle'}"></i><span>${msg}</span>`;
        if (window.lucide) lucide.createIcons();
      }

      let supabaseClient = null;
      async function initSupabase() {
        if (supabaseClient) return supabaseClient;
        const res = await fetch("/api/auth/config");
        const cfg = await res.json();
        if (cfg.supabase_enabled && window.supabase && cfg.supabase_url && cfg.supabase_anon_key) {
          supabaseClient = window.supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key);
        }
        return supabaseClient;
      }

      initSupabase().then((client) => {
        if (!client) {
          showAlert("Supabase recovery is not configured on this server.");
          return;
        }
        client.auth.onAuthStateChange((event) => {
          if (event === "PASSWORD_RECOVERY") {
            showAlert("Recovery link verified. Enter your new password below.", true);
          }
        });
      });

      formResetPw?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const pw = document.getElementById("newPassword")?.value || "";
        const confirmPw = document.getElementById("confirmPassword")?.value || "";
        const btn = document.getElementById("btnUpdatePw");

        if (pw.length < 6) {
          showAlert("Password must be at least 6 characters long.");
          return;
        }
        if (pw !== confirmPw) {
          showAlert("Passwords do not match.");
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i data-lucide="loader-circle" class="spin"></i><span>Updating…</span>';
        if (window.lucide) lucide.createIcons();

        try {
          const client = await initSupabase();
          if (!client) throw new Error("Supabase is not configured.");
          const { error } = await client.auth.updateUser({ password: pw });
          if (error) throw new Error(error.message);

          showAlert("Password updated successfully! Redirecting to Sign In…", true);
          setTimeout(() => {
            window.location.href = "/app/login?force=1";
          }, 1200);
        } catch (err) {
          showAlert(err.message || "Could not update password. Your recovery link may have expired.");
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="save"></i><span>Update Password</span>';
          if (window.lucide) lucide.createIcons();
        }
      });
    })();
  </script>
</body>
</html>
